name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/bike-fit-app-jis1ac
  workflow_dispatch:

# Only contents:write is needed to publish to the gh-pages branch.
# This avoids the github-pages deployment environment (and its
# default branch-protection rules) entirely.
permissions:
  contents: write

concurrency:
  group: pages-gh-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish static site to gh-pages branch
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Disable Jekyll so files/dirs are served verbatim.
          touch .nojekyll

          # Build an orphan branch containing only the static app.
          git checkout --orphan gh-pages
          git reset
          git add index.html css js img README.md .nojekyll
          git commit -m "Deploy site ${GITHUB_SHA}"
          git push -f origin gh-pages

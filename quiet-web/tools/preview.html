<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fox pose sheet</title>
<style>
  body { margin: 0; background: #1B0E33; color: #F7EFEA;
         font: 13px ui-rounded, system-ui, sans-serif; }
  canvas { display: block; margin: 0 auto; }
  p { text-align: center; opacity: 0.5; padding: 10px; margin: 0; }
</style>
</head>
<body>
<canvas id="sheet" width="1200" height="760"></canvas>
<p>Riding pose sheet — reload to re-simulate. Add ?scale=6 to zoom.</p>

<script type="module">
// A contact sheet for iterating on ProceduralFox without playing to the pose you
// want to look at. Each cell settles its own tail chain so the silhouette shown
// is one the solver actually produces, not a hand-posed approximation.
import { ProceduralFox, foxTailForces, foxTailSpread } from '../js/art/fox.js';
import { createChain, stepChain } from '../core/verlet.mjs';
import { squashStretch } from '../core/springs.mjs';
import { FIXED_DT } from '../core/physics.mjs';

const scale = Number(new URLSearchParams(location.search).get('scale')) || 4;
const ctx = document.getElementById('sheet').getContext('2d');

const POSES = [
  { label: 'cruise',          speed: 180, vy: 0,    air: false, angle: 0.16, land: 0, tumble: 0 },
  { label: 'steep',           speed: 420, vy: 0,    air: false, angle: 0.44, land: 0, tumble: 0 },
  { label: 'flat out',        speed: 620, vy: 0,    air: false, angle: 0.08, land: 0, tumble: 0 },
  { label: 'launch',          speed: 420, vy: -560, air: true,  angle: -0.3, land: 0, tumble: 0 },
  { label: 'flip ¼',          speed: 420, vy: -180, air: true,  angle: -1.6, land: 0, tumble: 0 },
  { label: 'flip ½',          speed: 420, vy: 120,  air: true,  angle: -3.1, land: 0, tumble: 0 },
  { label: 'flip ¾',          speed: 420, vy: 420,  air: true,  angle: -4.7, land: 0, tumble: 0 },
  { label: 'tumble',          speed: 180, vy: 0,    air: false, angle: 0.3,  land: 0.3, tumble: 1 },
];

/** Settle a tail chain under the motion this pose implies. */
function tailFor(pose) {
  const chain = createChain({ x: 0, y: -20, count: 11, segment: 3.0, taper: 0.05 });
  chain.spreadTarget = foxTailSpread(pose.speed, pose.air, 360);
  chain.spread = chain.spreadTarget;
  // Local space: the sheet draws the fox facing +x and mirrors via ctx.scale, so
  // the tail is always simulated trailing to the left, as the renderer expects.
  for (let i = 0; i < 400; i++) {
    stepChain(chain, FIXED_DT, {
      anchorX: -7,
      anchorY: -21,
      ...foxTailForces({ facing: 1, vx: pose.speed, vy: pose.vy }),
    });
  }
  return chain;
}

ctx.fillStyle = '#1B0E33';
ctx.fillRect(0, 0, 1200, 760);

const cols = 4;
const cellW = 1200 / cols;
const cellH = 380;

POSES.forEach((pose, i) => {
  const cx = (i % cols) * cellW + cellW / 2;
  const cy = Math.floor(i / cols) * cellH + cellH * 0.74;

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath();
  ctx.moveTo(cx - cellW / 2 + 12, cy);
  ctx.lineTo(cx + cellW / 2 - 12, cy);
  ctx.stroke();

  ctx.fillStyle = 'rgba(247,239,234,0.55)';
  ctx.font = '13px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(pose.label, cx, cy + 44);
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ProceduralFox.draw(ctx, 0, 0, {
    w: 22, h: 34,
    facing: 1,
    angle: pose.angle,
    phase: 1.1,
    airborne: pose.air,
    onGround: !pose.air,
    tail: tailFor(pose),
    squash: squashStretch(pose.vy, pose.land, 900),
    speed: pose.speed,
    tumble: pose.tumble,
    groundY: 0,
  });
  ctx.restore();
});
</script>
</body>
</html>

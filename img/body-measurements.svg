<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 370" font-family="system-ui, sans-serif">
  <defs>
    <marker id="abody" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- floor -->
  <line x1="20" y1="345" x2="280" y2="345" stroke="#8b93a3" stroke-width="2"/>

  <!-- simplified rider (front view) -->
  <g fill="none" stroke="#8b93a3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="150" cy="40" r="22"/>
    <line x1="150" y1="62" x2="150" y2="88"/>
    <path d="M118,88 L182,88 L176,196 L124,196 Z"/>      <!-- torso -->
    <path d="M110,88 L98,206 L106,214"/>                  <!-- left arm -->
    <path d="M190,88 L204,206 L196,214"/>                 <!-- right arm -->
    <path d="M132,196 L128,338 L116,340"/>                <!-- left leg -->
    <path d="M168,196 L172,338 L184,340"/>                <!-- right leg -->
  </g>

  <!-- Height (left) -->
  <g stroke="#19c37d" color="#19c37d">
    <line x1="40" y1="18" x2="40" y2="345" stroke-width="2" marker-start="url(#abody)" marker-end="url(#abody)"/>
    <line x1="40" y1="18" x2="150" y2="18" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="34" y="185" fill="#19c37d" font-size="13" transform="rotate(-90 34 185)" text-anchor="middle">Height</text>

  <!-- Inseam (right) -->
  <g stroke="#19c37d" color="#19c37d">
    <line x1="262" y1="196" x2="262" y2="345" stroke-width="2" marker-start="url(#abody)" marker-end="url(#abody)"/>
    <line x1="150" y1="196" x2="262" y2="196" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="276" y="270" fill="#19c37d" font-size="13" transform="rotate(-90 276 270)" text-anchor="middle">Inseam</text>

  <!-- Torso (center) -->
  <line x1="150" y1="90" x2="150" y2="194" stroke="#2b8cff" color="#2b8cff" stroke-width="2" marker-start="url(#abody)" marker-end="url(#abody)"/>
  <text x="158" y="145" fill="#2b8cff" font-size="13">Torso</text>

  <!-- Arm (right side) -->
  <line x1="190" y1="88" x2="204" y2="206" stroke="#f5a623" color="#f5a623" stroke-width="2" marker-start="url(#abody)" marker-end="url(#abody)"/>
  <text x="210" y="150" fill="#f5a623" font-size="13">Arm</text>

  <!-- Shoulder width (top) -->
  <g stroke="#2b8cff" color="#2b8cff">
    <line x1="110" y1="76" x2="190" y2="76" stroke-width="2" marker-start="url(#abody)" marker-end="url(#abody)"/>
    <line x1="110" y1="88" x2="110" y2="76" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="190" y1="88" x2="190" y2="76" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="150" y="70" fill="#2b8cff" font-size="12" text-anchor="middle">Shoulder width</text>
</svg>

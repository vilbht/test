<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" font-family="system-ui, sans-serif">
  <defs>
    <marker id="abike" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- wheels -->
  <g fill="none" stroke="#8b93a3" stroke-width="3">
    <circle cx="95" cy="210" r="52"/>
    <circle cx="345" cy="210" r="52"/>
    <circle cx="95" cy="210" r="4" fill="#8b93a3"/>
    <circle cx="345" cy="210" r="4" fill="#8b93a3"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#8b93a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="200" cy="210" r="5" fill="#8b93a3"/>          <!-- bottom bracket -->
    <line x1="200" y1="210" x2="165" y2="92"/>                <!-- seat tube -->
    <line x1="200" y1="210" x2="312" y2="160"/>              <!-- down tube -->
    <line x1="170" y1="96" x2="300" y2="132"/>               <!-- top tube -->
    <line x1="165" y1="92" x2="95" y2="210"/>                <!-- seat stay -->
    <line x1="200" y1="210" x2="95" y2="210"/>               <!-- chain stay -->
    <line x1="300" y1="132" x2="312" y2="160"/>              <!-- head tube -->
    <line x1="308" y1="150" x2="345" y2="210"/>              <!-- fork -->
    <line x1="300" y1="132" x2="305" y2="123"/>              <!-- stem -->
    <path d="M292,123 q14,-6 24,2"/>                          <!-- handlebar -->
    <line x1="140" y1="88" x2="196" y2="84" stroke-width="5"/> <!-- saddle -->
  </g>

  <!-- Saddle height (along seat tube) -->
  <line x1="200" y1="210" x2="165" y2="92" stroke="#19c37d" color="#19c37d" stroke-width="2.5" marker-start="url(#abike)" marker-end="url(#abike)"/>
  <text x="120" y="150" fill="#19c37d" font-size="13" transform="rotate(-73 120 150)" text-anchor="middle">Saddle height</text>

  <!-- Setback -->
  <g stroke="#f5a623" color="#f5a623">
    <line x1="200" y1="210" x2="200" y2="58" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="140" y1="88" x2="140" y2="58" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="140" y1="58" x2="200" y2="58" stroke-width="2" marker-start="url(#abike)" marker-end="url(#abike)"/>
  </g>
  <text x="170" y="51" fill="#f5a623" font-size="12" text-anchor="middle">Setback</text>

  <!-- Reach -->
  <g stroke="#2b8cff" color="#2b8cff">
    <line x1="305" y1="123" x2="305" y2="40" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="140" y1="88" x2="140" y2="40" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="140" y1="40" x2="305" y2="40" stroke-width="2" marker-start="url(#abike)" marker-end="url(#abike)"/>
  </g>
  <text x="222" y="33" fill="#2b8cff" font-size="12" text-anchor="middle">Saddle → bar reach</text>

  <!-- Drop -->
  <g stroke="#e879f9" color="#e879f9">
    <line x1="196" y1="84" x2="392" y2="84" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="305" y1="123" x2="392" y2="123" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="392" y1="84" x2="392" y2="123" stroke-width="2" marker-start="url(#abike)" marker-end="url(#abike)"/>
  </g>
  <text x="398" y="107" fill="#e879f9" font-size="12">Drop</text>
</svg>
